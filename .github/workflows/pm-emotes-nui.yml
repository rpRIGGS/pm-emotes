name: PM Emotes NUI static checks
on:
  push:
    branches: [development/powermoves-nui]
  pull_request:
    paths:
      - 'client/NUI/**'
      - '.github/workflows/pm-emotes-nui.yml'
jobs:
  nui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all NUI JavaScript modules
        run: |
          set -e
          for file in client/NUI/js/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Validate supplemental Lua catalog syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac5.4 -p client/AnimationList.lua
          luac5.4 -p client/PMSeating.lua
          luac5.4 -p client/PMSyncedCatalog.lua
          for file in client/PMDanceCatalog*.lua; do
            luac5.4 -p "$file"
          done
          python3 - <<'PY'
          import re
          from pathlib import Path
          manifest = Path("fxmanifest.lua").read_text()
          files = sorted(Path("client").glob("PMDanceCatalog*.lua"))
          assert len(files) == 5, f"expected 5 supplemental catalog modules, got {len(files)}"
          base = Path("client/AnimationList.lua").read_text()
          all_sources = [base] + [p.read_text() for p in files]
          ids = [m.group(1) for source in all_sources for m in re.finditer(r'\["(pmdance\d+)"\]', source)]
          assert len(ids) == len(set(ids)), "duplicate PM dance IDs"
          assert len(ids) == 3832, f"expected 3832 PM dances, got {len(ids)}"
          seating = Path("client/PMSeating.lua").read_text()
          assert seating.count("model = GetHashKey(") == 213, "chair offset catalog incomplete"
          assert "'client/PMSeating.lua'" in manifest, "seating module not loaded"
          synced = Path("client/PMSyncedCatalog.lua").read_text()
          assert synced.count('RP.Shared["pmsync') == 60, "expected 30 synchronized pairs"
          assert "'client/PMSyncedCatalog.lua'" in manifest, "synced module not loaded"
          assert "RegisterCommand('pmsit'" in seating and "RegisterCommand('pmstand'" in seating
          assert "function PMToggleNearbySeat()" in seating
          assert "RegisterNUICallback('SIT_NEARBY'" in Path("client/NUI/EmoteMenuNUI.lua").read_text()
          assert 'data-action="sitNearby"' in Path("client/NUI/index.html").read_text()
          assert 'case "sitNearby":' in Path("client/NUI/js/utils.js").read_text()

          for path in files:
              assert f"'client/{path.name}'" in manifest, f"not loaded: {path.name}"
          print(f"Validated {len(ids)} unique PM dance entries in manifest-loaded catalogs")
          PY
      - name: Validate synchronization and catalog UI contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sync = Path("client/Syncing.lua").read_text()
          group = Path("client/GroupEmote.lua").read_text()
          main = Path("client/NUI/js/main.js").read_text()
          assert "if player == -1 then return nil end" in sync, "sync must reject disconnected partner"
          assert "if not partnerPed then return end" in sync, "sync receiver guard missing"
          assert "if not pedInFront then return end" in sync, "sync sender guard missing"
          assert "if src ~= localPlayer then" in group, "group requests must exclude sender"
          assert 'const markup = (event.data[key] || []).filter(Boolean).map' in main, "large catalog must batch DOM writes"
          assert '_setupMenuEventListeners(MENUS);' in main, "static menu listeners missing"
          assert 'pm-dynamic-category' in main, "dynamic menu cleanup missing"
          print("Sync and catalog UI contracts verified")
          PY
      - name: Validate PM preview lifecycle contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          preview = Path("client/NUI/PMPreview.lua").read_text()
          emote = Path("client/Emote.lua").read_text()
          assert "previewGeneration" not in preview, "obsolete preview generation counter"
          assert "PMInvalidatePreviewProps()" in preview, "preview must invalidate async props"
          assert "ClearFacialIdleAnimOverride(previewPed)" in preview, "preview must clear old facial overrides"
          assert "local previewPropVersion = 0" in emote, "preview prop token missing"
          assert "data.previewVersion ~= previewPropVersion" in emote, "async prop guard missing"
          assert "local newProp = CreateObject(" in emote, "prop handles must be local"
          assert "return EmotePlayOnNonPlayerPed(previewPed, emoteName) ~= false" in preview
          print("Preview lifecycle contracts verified")
          PY
      - name: Validate NUI file references and required hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          html = Path("client/NUI/index.html").read_text()
          class Scanner(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if "id" in d:
                      assert d["id"] not in self.ids, f"duplicate id: {d['id']}"
                      self.ids.add(d["id"])
                  if tag == "script" and d.get("src"): self.refs.append(d["src"])
                  if tag == "link" and d.get("href"): self.refs.append(d["href"])
          scanner = Scanner()
          scanner.feed(html)
          for ref in scanner.refs:
              assert (Path("client/NUI") / ref).is_file(), f"missing NUI asset: {ref}"
          for name in ("pm-workspace", "pm-preview-panel", "side-navigation", "content-container"):
              assert name in html, f"missing required UI component: {name}"
          manifest = Path("fxmanifest.lua").read_text()
          assert "'client/NUI/PMPreview.lua'" in manifest
          assert "'client/NUI/EmoteMenuNUI.lua'" in manifest
          print("NUI static checks passed")
          PY

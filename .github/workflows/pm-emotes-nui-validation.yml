name: PM Emotes release validation

on:
  push:
    branches:
      - development/powermoves-nui
  pull_request:
  workflow_dispatch:

jobs:
  release-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate NoPixel and AutoShot JavaScript
        run: |
          node --check client/NUI/nopixel/assets/index-80592477.js
          node --check client/NUI/nopixel/assets/pm-autoshot-bridge.js
      - name: Validate PowerMoves NUI integration contracts
        run: python3 tests/validate_pm_emotes.py
      - name: Install Lua syntax checker
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Validate Lua NUI and preview syntax
        run: |
          luac5.4 -p client/NUI/EmoteMenuNUI.lua
          luac5.4 -p client/NUI/PMPreview.lua
          luac5.4 -p client/PMSeating.lua
      - name: Package complete FiveM resource
        run: python3 tools/package_pm_emotes.py
      - uses: actions/upload-artifact@v4
        with:
          name: pm-emotes-server-test
          path: dist/pm-emotes-server-test.zip
          if-no-files-found: error
